<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar do Vale</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1b16;--mut:#6b675c;--bd:#e3dfd3;--ac:#a4471f;--chip:#efe9da}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--card:#211e16;--tx:#f0ecdf;--mut:#a39d8b;--bd:#35311f;--ac:#e58a5b;--chip:#2e2a1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{margin:8px 0 2px;font-size:1.5rem}
h2{font-size:1rem;margin:4px 0 8px}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.abas button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--mut);font-weight:600}
.abas button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--ac)}
body[data-aba=camaras] .so-noticias,body[data-aba=noticias] .so-camaras,body:not([data-aba=fontes]) .so-fontes,
body[data-aba=fontes] .so-noticias,body[data-aba=fontes] .so-camaras,body[data-aba=fontes] .nao-fontes{display:none}
.resumo-fontes{margin:0 0 12px;color:var(--mut)}
details.grupo{margin-bottom:12px}
details.grupo summary{cursor:pointer;font-weight:600;padding:8px 0;min-height:44px}
.fonte{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:.9rem}
.fonte b{display:block}
.fonte span{color:var(--mut)}
.erro{color:var(--ac)}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filtros input[type=search]{grid-column:1/-1}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.chks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mut);min-height:44px;cursor:pointer}
label.chk input{width:20px;height:20px;margin:0;accent-color:var(--ac)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cats button{border-radius:99px;padding:8px 12px;font-size:.9rem}
.cats button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.ranking{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.ranking ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.ranking button{padding:6px 10px;font-size:.85rem;border-radius:99px}
.ranking .vazio{color:var(--mut);font-size:.9rem}
.n{color:var(--mut);font-size:.9rem;margin:0 0 8px}
article{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px}
article a{color:var(--tx);font-weight:600;text-decoration:none}
article a:hover{color:var(--ac);text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:.8rem;color:var(--mut);align-items:center}
.chip{background:var(--chip);border-radius:99px;padding:2px 9px}
.assunto{background:none;border:1px solid var(--bd)}
.incerta{background:none;border:1px dashed var(--mut);font-style:italic}
.ap{background:var(--ac);color:#fff}
.res{color:var(--mut);font-size:.9rem;margin:6px 0 0}
button{padding:10px 16px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
footer{color:var(--mut);font-size:.8rem;margin-top:24px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.barra .n{margin:0}
.barra button{padding:6px 12px;font-size:.85rem;flex-shrink:0}
.novo{background:#2f7d4f;color:#fff}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#mais-filtros{grid-column:1/-1}
#mais-filtros .filtros{margin:0}
#mais-filtros summary{display:none}
/* celular: filtros recolhidos atrás de um botão e abas fixas no topo */
@media (max-width:600px){
  main{padding:0 12px 16px}
  h1{font-size:1.25rem;margin-top:12px}
  .abas{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -12px 12px;padding:0 12px}
  .abas button{flex:1;padding:12px 4px}
  #mais-filtros summary{display:flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer;font-weight:600}
  #mais-filtros[open] summary{margin-bottom:8px}
  #mais-filtros .filtros{grid-template-columns:1fr}
  article{padding:12px 12px 10px}
}
</style>
</head>
<body data-aba="noticias">
<main>
<h1>Radar do Vale</h1>
<div class="sub" id="sub"></div>
<nav class="abas" role="tablist">
  <button role="tab" id="aba-noticias" aria-selected="true">Notícias</button>
  <button role="tab" id="aba-camaras" aria-selected="false">Câmaras</button>
  <button role="tab" id="aba-fontes" aria-selected="false">Fontes</button>
</nav>
<div class="filtros nao-fontes">
  <input type="search" id="q" aria-label="Buscar" placeholder='Buscar (ex.: escola, "saúde mental")'>
  <details id="mais-filtros"><summary id="resumo-filtros">Filtros</summary><div class="filtros">
  <select id="mun" aria-label="Cidade"><option value="">Todas as cidades</option></select>
  <select id="tipo" class="so-noticias" aria-label="Fonte">
    <option value="">Todas as fontes</option>
    <option value="imprensa">Imprensa</option>
    <option value="prefeitura">Prefeituras</option>
    <option value="camara">Câmaras (notícias, leis e proposições)</option>
    <option value="assembleia">Assembleia de Minas</option>
  </select>
  <select id="ass" aria-label="Assunto"><option value="">Todos os assuntos</option></select>
  <select id="per" aria-label="Período">
    <option value="1">Último dia</option><option value="7">7 dias</option>
    <option value="30">30 dias</option><option value="365">12 meses</option><option value="0" selected>Tudo</option>
  </select>
  <div class="chks so-noticias">
    <label class="chk" title="Aprovado, sancionado; leis, resoluções e decretos legislativos"><input type="checkbox" id="ap"> Só aprovações</label>
    <label class="chk" title="Resultados de votação por cidade (G1, UOL)"><input type="checkbox" id="el"> Mostrar eleições</label>
    <label class="chk" title="Esconde notícias em que a cidade não aparece no título nem no resumo (o Google achou só no texto)"><input type="checkbox" id="cf"> Só cidade no título</label>
  </div>
  </div></details>
</div>
<div class="cats so-camaras" id="cats"></div>
<section class="ranking so-camaras">
  <h2>Aprovações por cidade</h2>
  <ol id="ranking"></ol>
</section>
<div class="barra nao-fontes"><p class="n" id="n" aria-live="polite"></p><button type="button" id="csv">Baixar planilha</button></div>
<div id="lista" class="nao-fontes"></div>
<button id="mais" class="nao-fontes" hidden>Mostrar mais</button>
<section class="so-fontes" id="fontes"></section>
<footer id="rodape"></footer>
</main>
<script src="noticias.js"></script>
<script>
const R = window.RADAR, $ = id => document.getElementById(id);
const sem = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const NOME = {imprensa: 'Imprensa', prefeitura: 'Prefeitura', camara: 'Câmara', lei: 'Norma', proposicao: 'Proposição', assembleia: 'Assembleia de Minas'};
const CAT = {'': 'Tudo', aprovado: 'Aprovações', projeto: 'Projetos', sessao: 'Sessões', norma: 'Portarias e atos', outro: 'Outras'};
const fmt = d => new Date(d).toLocaleDateString('pt-BR', {day: '2-digit', month: 'short', year: 'numeric'});
const itens = R.itens.map(i => ({...i, _n: sem(i.t + ' ' + (i.r || '') + ' ' + i.m.join(' '))}));
let mostrando = 100, achados = [], aba = 'noticias', cat = '';

R.municipios.forEach(m => $('mun').add(new Option(m, m)));
const ASSUNTO = R.assuntos || {};
Object.entries(ASSUNTO).sort((a, b) => a[1].localeCompare(b[1])).forEach(([k, n]) => $('ass').add(new Option(n, k)));
$('sub').textContent = `${itens.length} itens · atualizado em ${fmt(R.gerado)} às ${new Date(R.gerado).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}`;

// preferências e "novas desde a última visita" ficam só neste navegador; sem armazenamento o painel funciona igual
const guardado = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* modo privado */ } };
const CAMPOS = ['q', 'mun', 'tipo', 'ass', 'per', 'ap', 'el', 'cf'];
const ultimaVisita = guardado('radar-visita');
guardar('radar-visita', R.gerado);
const novas = ultimaVisita ? itens.filter(i => i.d > ultimaVisita).length : 0;
if (novas) $('sub').textContent += ` · ${novas} novas desde sua última visita`;

// busca: palavras soltas ou "frase entre aspas"; todas precisam aparecer
const termos = s => [...s.matchAll(/"([^"]+)"|(\S+)/g)].map(m => sem(m[1] || m[2]));

function filtrar() {
  guardar('radar-filtros', Object.fromEntries(CAMPOS.map(id => [id, $(id).type === 'checkbox' ? $(id).checked : $(id).value])));
  const q = termos($('q').value), mun = $('mun').value;
  const dias = +$('per').value, corte = dias ? Date.now() - dias * 864e5 : 0;
  const ass = $('ass').value;
  const ativos = ['mun', 'tipo', 'ass'].filter(id => $(id).value).length + (dias ? 1 : 0) + ['ap', 'el', 'cf'].filter(id => $(id).checked).length;
  $('resumo-filtros').textContent = ativos ? `Filtros (${ativos} ${ativos > 1 ? 'ativos' : 'ativo'})` : 'Filtros';
  const base = i => Date.parse(i.d) >= corte && q.every(w => i._n.includes(w)) && (!ass || (i.as || []).includes(ass));
  const daCidade = i => !mun || i.m.includes(mun);
  if (aba === 'camaras') {
    const leg = itens.filter(i => i.lg && base(i));
    desenharRanking(leg.filter(i => i.lg === 'aprovado'), mun);
    const doMun = leg.filter(daCidade);
    desenharCats(doMun);
    achados = doMun.filter(i => cat ? i.lg === cat : i.lg !== 'outro');  // "Tudo" deixa de fora avisos e datas comemorativas
  } else {
    const tipo = $('tipo').value, ap = $('ap').checked, el = $('el').checked, cf = $('cf').checked;
    achados = itens.filter(i => base(i) && daCidade(i) &&
      (!tipo || i.k === tipo || (tipo === 'camara' && (i.k === 'lei' || i.k === 'proposicao'))) && (!ap || i.a) && (el || !i.e) && (!cf || i.c !== false));
  }
  mostrando = 100;
  desenhar();
}

function botao(txt, ao, extra) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = txt;
  b.onclick = ao;
  Object.assign(b, extra || {});
  return b;
}

function desenharCats(lista) {
  const conta = {};
  for (const i of lista) conta[i.lg] = (conta[i.lg] || 0) + 1;
  conta[''] = lista.length - (conta.outro || 0);
  $('cats').replaceChildren(...Object.keys(CAT).map(k => {
    const b = botao(`${CAT[k]} (${conta[k] || 0})`, () => { cat = k; filtrar(); });
    b.setAttribute('aria-pressed', String(cat === k));
    return b;
  }));
}

function desenharRanking(aprovados, mun) {
  const conta = {};
  for (const i of aprovados) for (const m of i.m) if (m !== 'Vale do Jequitinhonha') conta[m] = (conta[m] || 0) + 1;
  const top = Object.entries(conta).sort((a, b) => b[1] - a[1]).slice(0, 12);
  if (!top.length) {
    const li = document.createElement('li');
    li.className = 'vazio';
    li.textContent = 'Nenhuma aprovação no período.';
    return $('ranking').replaceChildren(li);
  }
  $('ranking').replaceChildren(...top.map(([m, n]) => {
    const li = document.createElement('li');
    const b = botao(`${m} · ${n}`, () => { $('mun').value = mun === m ? '' : m; cat = 'aprovado'; filtrar(); });
    b.setAttribute('aria-pressed', String(mun === m));
    li.append(b);
    return li;
  }));
}

function chip(txt, cls) {
  const s = document.createElement('span');
  s.className = 'chip ' + (cls || '');
  s.textContent = txt;
  return s;
}

function desenhar() {
  const l = $('lista');
  l.replaceChildren();
  if (aba === 'camaras') {
    $('n').textContent = `${achados.length} itens do legislativo`;
  } else {
    const ocultas = $('el').checked ? 0 : itens.filter(i => i.e).length;
    $('n').textContent = `${achados.length} resultados` + (ocultas ? ` · ${ocultas} resultados de eleição ocultos` : '');
  }
  for (const i of achados.slice(0, mostrando)) {
    const a = document.createElement('article'), t = document.createElement('a');
    t.textContent = i.t;
    if (/^https?:/.test(i.u)) { t.href = i.u; t.target = '_blank'; t.rel = 'noopener noreferrer'; }
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.append(fmt(i.d), chip(i.m.join(', ')), chip(NOME[i.k] + ' · ' + i.f));
    if (aba === 'camaras' && i.lg !== 'aprovado') meta.append(chip(CAT[i.lg]));
    if (ultimaVisita && i.d > ultimaVisita) meta.append(chip('novo', 'novo'));
    if (i.c === false) meta.append(chip('cidade só no texto', 'incerta'));
    if (i.a) meta.append(chip('aprovação', 'ap'));
    for (const s of i.as || []) meta.append(chip(ASSUNTO[s], 'assunto'));
    a.append(t, meta);
    if (i.r) { const p = document.createElement('p'); p.className = 'res'; p.textContent = i.r; a.append(p); }
    l.append(a);
  }
  $('mais').hidden = achados.length <= mostrando;
}

const ABAS = ['noticias', 'camaras', 'fontes'];

function mudarAba(nova) {
  aba = nova;
  document.body.dataset.aba = nova;
  ABAS.forEach(a => $('aba-' + a).setAttribute('aria-selected', String(a === nova)));
  history.replaceState(null, '', nova === 'noticias' ? '#' : '#' + nova);
  if (nova === 'fontes') desenharFontes(); else filtrar();
}

const ha = d => {
  const h = (Date.now() - Date.parse(d)) / 36e5;
  return h < 1 ? 'há menos de 1 hora' : h < 48 ? `há ${Math.round(h)} h` : `há ${Math.round(h / 24)} dias`;
};

// falha: nada funcionou nas últimas 36 h (nem no PC nem na nuvem); parada: funciona, mas a notícia mais nova tem 90+ dias
function estadoFonte(s) {
  if (!s.ok || Date.now() - Date.parse(s.ok) > 36 * 36e5) return 'falha';
  return s.recente && Date.now() - Date.parse(s.recente) > 90 * 864e5 ? 'parada' : 'ok';
}

function desenharFontes() {
  const grupos = {falha: [], parada: [], ok: []};
  for (const [nome, s] of Object.entries(R.saude || {}).sort()) grupos[estadoFonte(s)].push([nome, s]);
  const TITULO = {falha: 'Com falha', parada: 'Sem notícia nova há 90+ dias', ok: 'Funcionando'};
  const resumo = document.createElement('p');
  resumo.className = 'resumo-fontes';
  resumo.textContent = `${grupos.ok.length} funcionando · ${grupos.parada.length} paradas · ${grupos.falha.length} com falha`;
  const secoes = Object.keys(grupos).map(g => {
    const d = document.createElement('details'), sm = document.createElement('summary');
    d.className = 'grupo';
    d.open = g !== 'ok';
    sm.textContent = `${TITULO[g]} (${grupos[g].length})`;
    d.append(sm, ...grupos[g].map(([nome, s]) => {
      const div = document.createElement('div'), b = document.createElement('b'), info = document.createElement('span');
      div.className = 'fonte';
      b.textContent = nome;
      info.textContent = [s.ok ? `funcionou ${ha(s.ok)} (${s.onde}), ${s.itens} itens` : 'nunca funcionou',
        s.recente ? `notícia mais nova ${ha(s.recente)}` : 'nenhuma notícia do Vale'].join(' · ');
      div.append(b, info);
      if (s.erro) { const e = document.createElement('span'); e.className = 'erro'; e.textContent = ` · erro: ${s.erro}`; div.append(e); }
      return div;
    }));
    return d;
  });
  $('fontes').replaceChildren(resumo, ...secoes);
}

$('aba-noticias').onclick = () => mudarAba('noticias');
$('aba-camaras').onclick = () => mudarAba('camaras');
$('aba-fontes').onclick = () => mudarAba('fontes');
$('mais').onclick = () => { mostrando += 100; desenhar(); };
$('mais-filtros').open = !matchMedia('(max-width:600px)').matches;
const salvos = guardado('radar-filtros') || {};
for (const id of CAMPOS) {
  if (id in salvos) $(id)[$(id).type === 'checkbox' ? 'checked' : 'value'] = salvos[id];
  if ($(id).tagName === 'SELECT' && $(id).selectedIndex < 0) $(id).selectedIndex = 0;  // opção que não existe mais
  $(id).addEventListener('input', filtrar);
}

// planilha (CSV, abre no Excel/Sheets) com o que está filtrado agora
$('csv').onclick = () => {
  const cel = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const linhas = [['data', 'cidades', 'título', 'fonte', 'tipo', 'assuntos', 'link']].concat(achados.map(i =>
    [i.d.slice(0, 10), i.m.join('; '), i.t, i.f, NOME[i.k], (i.as || []).map(s => ASSUNTO[s]).join('; '), i.u]));
  const blob = new Blob(['﻿' + linhas.map(l => l.map(cel).join(';')).join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `radar-vale-${aba}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};
const f = R.fontes;
$('rodape').textContent = `Fontes com resultado nesta coleta: ${f.com_itens} de ${f.total}. Detalhes na aba Fontes.`;
mudarAba(ABAS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'noticias');
</script>
</body>
</html>
